/* v5.4 Heavy / premium mahjong theme */

<body>
<header>🀄 フリー麻雀収支 <small style="font-size:11px;font-weight:500;opacity:.7">v5.4</small></header>
<main>
<section id="home" class="screen active">
<div class="card">
<h1>今日はどこの店舗ですか？</h1>
<div class="sub">店舗を選ぶと、その店舗のルールと成績を自動で読み込みます。</div>
<div id="storeList"></div>
<div id="homeToday" style="margin:16px 0 4px"></div>
<button class="store add" type="button" onclick="openNewStore()">＋ 新しい店舗を登録</button>
</div>
<div class="card"><button class="primary" type="button" onclick="showStats()">成績を見る</button></div>
</section>

<section id="register" class="screen">
<div class="card">
<button class="back" type="button" onclick="show('home')">← 戻る</button><h2 id="registerTitle">店舗を登録</h2>
<div class="field"><label>店舗名</label><input id="shop" autocomplete="off"></div>
<div class="field"><label>人数</label><select id="players"><option value="4">四麻</option><option value="3">三麻</option></select></div>
<div class="grid">
<div class="field"><label>点数レート（円/1000点）</label><input id="pointRate" type="number" placeholder="例：100" step="1"></div>
<div class="field"><label>チップ（円/枚）</label><input id="chipValue" type="number" value="500"></div>
<div class="field"><label>ゲーム代（円/ゲーム）</label><input id="gameFee" type="number" value="500"></div>
<div class="field"><label>トップ賞等（円/ゲーム）</label><input id="topFee" type="number" value="0"></div>
</div>
<div class="grid"><div class="field"><label>持ち点</label><input id="startPoints" type="number" value="25000"></div><div class="field"><label>返し点</label><input id="returnPoints" type="number" value="30000"></div></div><div class="field"><label>箱下計算</label><select id="belowZero"><option value="yes">有（マイナス点まで計算）</option><option value="no">無（0点未満は入力不可）</option></select></div><div class="field" id="tobiField"><label>トビ賞（金額・円）</label><input id="tobiAmount" type="number" min="0" step="100" value="0" placeholder="例：500"><div class="note" style="margin-top:6px">箱下計算の有無にかかわらず設定できます。トビが発生した対局の収支に反映します。</div></div>
<div class="field"><label>ウマ</label><select id="umaType">
<option value="1-2">1-2（ワンツー）</option><option value="1-3">1-3（ワンスリー）</option>
<option value="2-3">2-3（ツースリー）</option><option value="2-4">2-4（ツーフォー）</option>
</select><div class="note" style="margin-top:6px">1＝1,000点として、点数レートで円換算します。</div></div>
<div class="field"><label>ルールメモ</label><input id="memo" placeholder="例：赤3・祝儀あり"></div>
<button class="primary" type="button" onclick="saveStore()">保存する</button>
</div>
</section>

<section id="game" class="screen">
<div class="card">
<button class="back" type="button" onclick="cancelGameEdit()">← 店舗選択へ戻る</button>
<div id="todayRankSummary" style="margin-bottom:20px"></div>
<div id="rankQuickStats" class="summary" style="margin-bottom:24px"></div>
<h2 id="inputTitle">対局入力</h2>
<div class="field"><label>対局日</label><input id="gameDate" type="date"></div>
<div id="gameNo" class="gameNo"></div>
<div class="field"><label>着順</label><div id="rankButtons" class="rankButtons"></div><input id="rank" type="hidden" value="1"></div>
<div class="scoreChipRow">
<div class="field scoreField">
<label>最終持ち点</label>
<div class="scoreInputWrap">
<input id="points" class="scoreInput" type="number" step="1" inputmode="numeric" placeholder="例：250">
<span id="scoreSuffix" class="scoreSuffix" style="display:none">00</span>
</div>
</div>
<div class="field chipField">
<label>獲得チップ</label>
<div class="chipStepper">
<button class="chipBtn" type="button" onclick="changeChips(-1)">−</button>
<div id="chipDisplay" class="chipValueBox">0枚</div>
<button class="chipBtn" type="button" onclick="changeChips(1)">＋</button>
</div>
<input id="chips" type="hidden" value="0">
</div>
</div>
<div class="result"><div class="note">今回の実収支（ゲーム代込み）</div><div class="profit" id="calc">0円</div><div id="breakdown"></div></div>
<button class="primary" style="margin-top:12px" type="button" onclick="recordGame()" id="recordBtn">この結果を記録</button>
<button class="danger" type="button" id="deleteBtn" style="display:none" onclick="deleteRecord()">この対局記録を削除</button>
</div>
</section>

<section id="stats" class="screen">
<div class="card"><h2>最近の対局</h2><div class="note" style="margin-bottom:8px">タップすると内容を編集できます。</div><div id="history"></div>
<div id="nextGameFromStats" style="margin-top:18px"></div></div>
<div class="card"><button class="back" type="button" onclick="show('home')">← 店舗選択へ戻る</button><h2>成績</h2>
<div class="toolbar"><select id="statsStore" onchange="renderStats()"></select></div>
<div class="statgrid">
<div class="stat">今日・実収支<b id="todayTotal">0円</b></div><div class="stat">今月・実収支<b id="monthTotal">0円</b></div>
<div class="stat">今年・実収支<b id="yearTotal">0円</b></div><div class="stat">累計・実収支<b id="allTotal">0円</b></div>
<div class="stat">累計・ゲーム代抜き<b id="grossTotal">0円</b></div><div class="stat">平均着順<b id="avgRank">-</b></div>
<div class="stat">対局数<b id="gameCount">0</b></div><div class="stat">平均実収支<b id="avg">0円</b></div>
</div></div>

<div class="card"><h2>店舗別収支</h2><div id="storeBreakdown"></div></div>

<div class="card"><h2>着順成績</h2>
<div class="pillrow"><button class="pill active" data-period="day" onclick="setRankPeriod('day')">今日</button><button class="pill" data-period="month" onclick="setRankPeriod('month')">今月</button><button class="pill" data-period="year" onclick="setRankPeriod('year')">今年</button></div>
<div id="rankSummary"></div><div id="rankChart" class="chart"></div></div>

<div class="card"><h2>月別収支（棒グラフ）</h2><div id="monthlyChart" class="chart"></div><div id="monthly"></div></div>

</section>
</main>
<script>
const $=id=>document.getElementById(id);
let stores=[],records=[],selected=null,editStoreIndex=-1,editRecordIndex=-1,rankPeriod="day",historyLimit=10;
const rawStores=localStorage.getItem("fm_stores"), rawRecords=localStorage.getItem("fm_records");
// 読み込み時は絶対に空データで上書きしない。既存データは退避してから扱う。
try{stores=JSON.parse(rawStores||"[]");records=JSON.parse(rawRecords||"[]")}catch(e){stores=[];records=[]}
if(rawStores && rawStores!=="[]" && !localStorage.getItem("fm_stores_backup")) localStorage.setItem("fm_stores_backup",rawStores);
if(rawRecords && rawRecords!=="[]" && !localStorage.getItem("fm_records_backup")) localStorage.setItem("fm_records_backup",rawRecords);
const localToday=()=>{const d=new Date(),z=d.getTimezoneOffset()*60000;return new Date(d-z).toISOString().slice(0,10)};
const today=localToday();

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,8)}
stores=stores.map(s=>({...s,id:s.id||uid(),startPoints:+s.startPoints||25000,belowZero:s.belowZero||"no",tobiAmount:+s.tobiAmount||0,umaType:s.umaType||guessUma(s.uma)}));
/* v5.4: known Cabo settings correction from the user's confirmed rules */
stores=stores.map(s=>{
  if(s.shop==="麻雀カボ船橋店"){
    return {...s,pointRate:100,startPoints:25000,returnPoints:30000,gameFee:600,topFee:(s.topFee==null?0:+s.topFee),umaType:"1-3"};
  }
  return s;
});
records=records.map(r=>{const st=stores.find(x=>x.id===r.storeId)||stores.find(x=>x.shop===r.shop);const games=+r.games||1;const fee=st?(+st.gameFee||0)+((+r.rank===1)?(+st.topFee||0):0):0;return {...r,id:r.id||uid(),storeId:r.storeId||(st&&st.id)||"",gross:r.gross!=null?+r.gross:(+r.total||0)+fee,games:games}});
// 2026-09-21に消失したことを確認済みの2局を一度だけ復元。
if(!localStorage.getItem("fm_recovered_20260921") && records.length===0){
  let st=stores.find(x=>x.shop==="麻雀カボ船橋店");
  if(!st){st={id:uid(),shop:"麻雀カボ船橋店",players:4,pointRate:100,chipValue:500,gameFee:600,topFee:0,startPoints:25000,returnPoints:30000,belowZero:s.belowZero||"no",tobiAmount:+s.tobiAmount||0,umaType:"1-3",memo:""};stores.push(st)}
  records=[1,2].map(n=>({id:uid(),date:"2026-09-21",shop:st.shop,storeId:st.id,total:2500,gross:3000,rank:1,points:30000,chips:0,games:1,players:4,recovered:true}));
  localStorage.setItem("fm_stores",JSON.stringify(stores));localStorage.setItem("fm_records",JSON.stringify(records));localStorage.setItem("fm_recovered_20260921","1");
}
$("gameDate").value=today;

function guessUma(a){if(!Array.isArray(a))return"1-2";const v=a.map(x=>Math.abs(+x));if(v.includes(4000)||v.includes(4))return"2-4";if(v.includes(3000)||v.includes(3)){return (v.includes(2000)||v.includes(2))?"2-3":"1-3"}return"1-2"}
function saveAll(){
 const oldS=localStorage.getItem("fm_stores"),oldR=localStorage.getItem("fm_records");
 if(oldS&&oldS!=="[]")localStorage.setItem("fm_stores_backup",oldS);
 if(oldR&&oldR!=="[]")localStorage.setItem("fm_records_backup",oldR);
 localStorage.setItem("fm_stores",JSON.stringify(stores));localStorage.setItem("fm_records",JSON.stringify(records));
}
function show(id){document.querySelectorAll(".screen").forEach(x=>x.classList.remove("active"));$(id).classList.add("active");if(id==="home")renderStores();window.scrollTo(0,0)}
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
function fmt(n){n=Math.round(+n||0);return(n>=0?"+":"")+n.toLocaleString()+"円"}
function storeForRecord(r){return stores.find(s=>s.id===r.storeId)||stores.find(s=>s.shop===r.shop)}
function umaUnits(type){return {"1-2":[2,1,-1,-2],"1-3":[3,1,-1,-3],"2-3":[3,2,-2,-3],"2-4":[4,2,-2,-4]}[type]||[2,1,-1,-2]}
function umaYen(s,rank){return (umaUnits(s.umaType)[rank-1]||0)*1000}
function okaYen(s,rank){
 const players=+s.players||4,start=+s.startPoints||25000,ret=+s.returnPoints||30000,rate=+s.pointRate||0;
 return rank===1?Math.round((ret-start)*players/1000*rate):0;
}
function feePerGame(s){return (+s.gameFee||0)+(+s.topFee||0)}
function recGross(r){if(r.gross!=null)return +r.gross||0;const s=storeForRecord(r);return (+r.total||0)+(s?feePerGame(s)*(+r.games||1):0)}
function gameNumber(r,idx){const same=records.map((x,i)=>({x,i})).filter(o=>o.x.date===r.date && (o.x.storeId===r.storeId || (!o.x.storeId&&o.x.shop===r.shop))).sort((a,b)=>a.i-b.i);return same.findIndex(o=>o.i===idx)+1}
function nextGameNumber(date,storeId,exclude=-1){return records.filter((r,i)=>i!==exclude&&r.date===date&&r.storeId===storeId).length+1}

function renderHomeToday(){
 const rr=records.filter(r=>r.date===today);
 if(!rr.length){$("homeToday").innerHTML='<div class="note">今日の成績：まだ対局記録がありません。</div>';return}
 const maxPlayers=Math.max(4,...rr.map(r=>+r.players||storeForRecord(r)?.players||4));
 const counts=Array.from({length:maxPlayers},(_,i)=>rr.filter(r=>+r.rank===i+1).length);
 $("homeToday").innerHTML=`<div style="font-weight:800;margin-bottom:8px">今日の成績</div><div class="rankgrid">${counts.slice(0,4).map((n,i)=>`<div class="rankbox">${i+1}着<b>${n}回</b></div>`).join("")}</div>`;
}
function renderStores(){
 renderHomeToday();
 const box=$("storeList");
 if(!stores.length){box.innerHTML='<div class="empty">まだ店舗が登録されていません。</div>';return}
 box.innerHTML=stores.map((s,i)=>`<div><button class="store" type="button" onclick="selectStore(${i})">${esc(s.shop)}</button><button class="edit" type="button" onclick="editStore(${i})">編集</button></div>`).join("");
}
function openNewStore(){editStoreIndex=-1;$("registerTitle").textContent="店舗を登録";clearForm();toggleTobiField();show("register")}
function clearForm(){["shop","memo"].forEach(id=>$(id).value="");$("players").value="4";$("pointRate").value="";$("chipValue").value="500";$("gameFee").value="600";$("topFee").value="0";$("startPoints").value="25000";$("returnPoints").value="30000";$("belowZero").value="no";$("tobiAmount").value="0";$("umaType").value="1-2"}
function editStore(i){editStoreIndex=i;const s=stores[i];$("registerTitle").textContent="店舗設定を編集";$("shop").value=s.shop;$("players").value=s.players;$("pointRate").value=s.pointRate;$("chipValue").value=s.chipValue;$("gameFee").value=s.gameFee;$("topFee").value=s.topFee;$("startPoints").value=s.startPoints||25000;$("returnPoints").value=s.returnPoints;$("belowZero").value=s.belowZero||"no";$("tobiAmount").value=s.tobiAmount||0;$("umaType").value=s.umaType||"1-2";$("memo").value=s.memo||"";toggleTobiField();show("register")}
function toggleTobiField(){if($("tobiField"))$("tobiField").style.display="block"}
function saveStore(){
 const name=$("shop").value.trim();if(!name){alert("店舗名を入力してください。");return}
 if($("pointRate").value===""){alert("点数レートを入力してください。");return}
 const old=editStoreIndex>=0?stores[editStoreIndex]:null;
 const s={id:old?.id||uid(),shop:name,players:+$("players").value,pointRate:+$("pointRate").value,chipValue:+$("chipValue").value,gameFee:+$("gameFee").value,topFee:+$("topFee").value,startPoints:+$("startPoints").value,returnPoints:+$("returnPoints").value,belowZero:$("belowZero").value,tobiAmount:+$("tobiAmount").value||0,umaType:$("umaType").value,memo:$("memo").value};
 if(editStoreIndex>=0){stores[editStoreIndex]=s;records.forEach(r=>{if(r.storeId===s.id)r.shop=s.shop})}else stores.push(s);
 saveAll();editStoreIndex=-1;alert("店舗を保存しました。");show("home");
}
function selectStore(i){
 selected=stores[i];editRecordIndex=-1;setupGameScreen();$("gameDate").value=today;$("points").value="";updatePointsPreview();updateScoreSuffix();$("chips").value=0;renderChipDisplay();$("rank").value="1";updateRankButtons();updateGameNo();show("game");calc();
}
function setupGameScreen(){
renderTodayRankSummary();
$("rankButtons").innerHTML=Array.from({length:selected.players},(_,i)=>`<button type="button" class="rankBtn" data-rank="${i+1}" onclick="setRank(${i+1})">${i+1}着</button>`).join(""); updateRankButtons(); $("points").min=selected.belowZero==="yes"?"":0;
 $("inputTitle").textContent=editRecordIndex>=0?"対局記録を編集":"対局入力";$("recordBtn").textContent=editRecordIndex>=0?"変更を保存":"この結果を記録";$("deleteBtn").style.display=editRecordIndex>=0?"block":"none";
 renderRankQuickStats();
}
function renderRankQuickStats(){}

function setRank(r){$("rank").value=String(r);updateRankButtons();calc()}
function updateRankButtons(){document.querySelectorAll(".rankBtn").forEach(b=>b.classList.toggle("active",b.dataset.rank===$("rank").value))}
function updateGameNo(){if(!selected)return;$("gameNo").textContent=`この日は ${nextGameNumber($("gameDate").value||today,selected.id,editRecordIndex)}ゲーム目`}
function renderChipDisplay(){const v=Math.max(-10,Math.min(10,+$("chips").value||0));$("chips").value=v;if($("chipDisplay"))$("chipDisplay").textContent=(v>0?"+":"")+v+"枚";}
function changeChips(d){const v=Math.max(-10,Math.min(10,(+$("chips").value||0)+d));$("chips").value=v;renderChipDisplay();calc();}
function updatePointsPreview(){}

function renderGameTodayRanks(){
 if(!$("gameTodayRanks")||!selected)return;
 const d=$("date")?.value||today;
 const rr=records.filter(r=>r.date===d && r.storeId===selected.id);
 const maxRank=(+selected.players===3)?3:4;
 const counts=Array.from({length:maxRank},(_,i)=>rr.filter(r=>+r.rank===i+1).length);
 $("gameTodayRanks").innerHTML=`<div style="font-weight:800;font-size:18px;margin-bottom:10px">今日の成績</div><div class="rankgrid">${counts.map((n,i)=>`<div class="rankbox">${i+1}着<b>${n}回</b></div>`).join("")}</div>`;
}


let rankSummaryMode="today";
function setRankSummaryMode(mode){rankSummaryMode=mode;renderTodayRankSummary()}
function dateShift(ymd,days){const d=new Date(ymd+"T12:00:00");d.setDate(d.getDate()+days);return d.toISOString().slice(0,10)}
function renderTodayRankSummary(){
 const box=$("todayRankSummary"); if(!box)return;
 const d=$("gameDate")?.value||today, prev=dateShift(d,-1);
 const dates=rankSummaryMode==="carry"?[prev,d]:[d];
 const rr=records.filter(r=>dates.includes(r.date));
 const dayLabel=d===today?"今日":"この日";
 const tab1=rankSummaryMode==="today"?"active":"", tab2=rankSummaryMode==="carry"?"active":"";

 if(!rr.length){
   box.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:12px">
     <button type="button" class="pill ${tab1}" onclick="setRankSummaryMode('today')">${dayLabel}</button>
     <button type="button" class="pill ${tab2}" onclick="setRankSummaryMode('carry')">前日から合算</button>
   </div><div class="note">この期間の対局記録はありません。</div>`;
   if($("rankQuickStats")) $("rankQuickStats").innerHTML="";
   return;
 }

 const groups={};
 rr.forEach(r=>{
   const key=r.storeId||r.shop||"unknown";
   if(!groups[key]) groups[key]={name:r.shop||"店舗",records:[]};
   groups[key].records.push(r);
 });

 const cards=Object.values(groups).map(g=>{
   const st=stores.find(s=>s.id===g.records[0].storeId)||stores.find(s=>s.shop===g.name);
   const n=(+st?.players===3)?3:4;
   const counts=Array.from({length:n},(_,i)=>g.records.filter(r=>+r.rank===i+1).length);
   const net=g.records.reduce((a,r)=>a+(+r.total||0),0);
   const gross=g.records.reduce((a,r)=>a+recGross(r),0);
   return `<div class="dayStoreCard">
     <div class="dayStoreName">${esc(g.name)}</div>
     <div class="dayRankGrid" style="grid-template-columns:repeat(${n},1fr)">
       ${counts.map((c,i)=>`<div class="dayRankCell"><div>${i+1}着</div><b>${c}回</b></div>`).join("")}
     </div>
     <div class="summary" style="margin-top:10px">
       <div>実収支<b class="${net>=0?'pos':'neg'}">${fmt(net)}</b></div>
       <div>ゲーム代抜き<b class="${gross>=0?'pos':'neg'}">${fmt(gross)}</b></div>
     </div>
   </div>`;
 }).join("");

 box.innerHTML=`<div style="display:flex;gap:8px;margin-bottom:12px">
   <button type="button" class="pill ${tab1}" onclick="setRankSummaryMode('today')">${dayLabel}</button>
   <button type="button" class="pill ${tab2}" onclick="setRankSummaryMode('carry')">前日から合算</button>
 </div>${cards}`;

 if($("rankQuickStats")) $("rankQuickStats").innerHTML="";
}

function updateScoreSuffix(){
 const suffix=$("scoreSuffix");
 if(!suffix)return;
 suffix.style.display=$("points").value!==""?"block":"none";
}
function calc(){
 renderTodayRankSummary();
 renderGameTodayRanks();
 updateScoreSuffix();
 if(!selected)return;
 if($("points").value===""){
   $("calc").textContent="—";
   $("calc").className="profit";
   $("breakdown").innerHTML='<span class="note">最終持ち点を入力してください。</span>';
   return {total:0,gross:0,emptyPoints:true};
 }
 const p=(+$("points").value||0)*100,r=+$("rank").value||1,c=+$("chips").value||0;
 const score=(p-(+selected.returnPoints||0))/1000*(+selected.pointRate||0),oka=okaYen(selected,r),uma=umaYen(selected,r),chip=c*(+selected.chipValue||0),gross=Math.round(score+oka+uma+chip),fee=-(+selected.gameFee||0),extraFee=r===1?-(+selected.topFee||0):0,tobi=((selected.belowZero==="yes"&&p<0)||(selected.belowZero!=="yes"&&p<=0))?-(+selected.tobiAmount||0):0,total=Math.round(gross+fee+extraFee+tobi);
 $("calc").textContent=fmt(total);$("calc").className="profit "+(total>=0?"pos":"neg");
 $("breakdown").innerHTML=`素点 ${fmt(score)} ＋ オカ ${fmt(oka)} ＋ ウマ ${fmt(uma)} ＋ チップ ${fmt(chip)}<br>ゲーム代抜き ${fmt(gross)} ／ ゲーム代 ${fmt(fee)}${extraFee?` ／ トップ賞 ${fmt(extraFee)}`:""}${tobi?` ／ トビ賞 ${fmt(tobi)}`:""}`;
 return {total,gross};
}
$("belowZero").addEventListener("change",toggleTobiField);
["gameDate","points"].forEach(id=>$(id).addEventListener("input",()=>{if(id==="gameDate")updateGameNo();if(id==="points")updatePointsPreview();calc()}));
function recordGame(){
 if(!selected)return;
 if($("points").value===""){alert("最終持ち点を入力してください。");return;}
 if(selected.belowZero!=="yes" && ((+$("points").value||0)*100)<0){alert("この店舗は箱下計算「無」のため、マイナス点は入力できません。");return;}const {total,gross}=calc(),r=+$("rank").value||1,p=(+$("points").value||0)*100,c=+$("chips").value||0,date=$("gameDate").value||today;
 const obj={id:editRecordIndex>=0?records[editRecordIndex].id:uid(),date,shop:selected.shop,storeId:selected.id,total,gross,rank:r,points:p,chips:c,games:1,players:selected.players};
 if(editRecordIndex>=0)records[editRecordIndex]=obj;else records.push(obj);
 saveAll();const msg=editRecordIndex>=0?"変更を保存しました":"記録しました";editRecordIndex=-1;alert(`${msg}：${fmt(total)}`);showStats(selected.id);
}
function editRecord(i){
 const r=records[i],s=storeForRecord(r);if(!s){alert("この記録の店舗設定が見つかりません。");return}
 selected=s;editRecordIndex=i;setupGameScreen();$("gameDate").value=r.date;$("rank").value=String(r.rank);updateRankButtons();$("points").value=Math.round((+r.points||0)/100);updatePointsPreview();updateScoreSuffix();$("chips").value=Math.max(-10,Math.min(10,+r.chips||0));renderChipDisplay();updateGameNo();show("game");calc();
}
function deleteRecord(){if(editRecordIndex<0)return;if(!confirm("この対局記録を削除しますか？"))return;records.splice(editRecordIndex,1);saveAll();editRecordIndex=-1;showStats(selected?.id||"all")}
function cancelGameEdit(){editRecordIndex=-1;show("home")}


function renderNextGameButton(storeId){
 const box=$("nextGameFromStats"); if(!box)return;
 if(!storeId){box.innerHTML="";return}
 const st=stores.find(x=>x.id===storeId); if(!st){box.innerHTML="";return}
 box.innerHTML=`<button class="primary" type="button" onclick="nextGameSameStore('${storeId}')">同じ店舗で次の対局を入力</button>`;
}
function nextGameSameStore(storeId){
 const st=stores.find(x=>x.id===storeId); if(!st)return;
 selected=st;
 show("game");
 $("gameDate").value=today;
 editRecordIndex=-1;
 $("rank").value="1";
 updateRankButtons();
 $("points").value="";
 updateScoreSuffix();
 $("chips").value=0;
 if(typeof renderChipDisplay==="function")renderChipDisplay();
 if(typeof updateGameNo==="function")updateGameNo();
 calc();
 window.scrollTo({top:0,behavior:"smooth"});
}

function showStats(storeId){
 historyLimit=10;
 renderNextGameButton(storeId||"");
 $("statsStore").innerHTML=`<option value="all">全店舗</option>`+stores.map(s=>`<option value="${s.id}">${esc(s.shop)}</option>`).join("");
 $("statsStore").value=storeId&&stores.some(s=>s.id===storeId)?storeId:"all";renderStats();show("stats");
}
function filteredRecords(){const v=$("statsStore").value;return v==="all"?records:records.filter(r=>r.storeId===v)}
function sumOf(rr,key="total"){return rr.reduce((a,r)=>a+(key==="gross"?recGross(r):(+r.total||0)),0)}
function renderStats(){
 const rr=filteredRecords(),y=today.slice(0,4),m=today.slice(0,7),by=fn=>rr.filter(fn);
 const day=by(r=>r.date===today),mon=by(r=>r.date.slice(0,7)===m),yr=by(r=>r.date.slice(0,4)===y),all=sumOf(rr);
 $("todayTotal").textContent=fmt(sumOf(day));$("monthTotal").textContent=fmt(sumOf(mon));$("yearTotal").textContent=fmt(sumOf(yr));$("allTotal").textContent=fmt(all);$("grossTotal").textContent=fmt(sumOf(rr,"gross"));$("gameCount").textContent=rr.length;$("avg").textContent=fmt(rr.length?all/rr.length:0);$("avgRank").textContent=rr.length?(rr.reduce((a,r)=>a+(+r.rank||0),0)/rr.length).toFixed(2)+"着":"-";
 renderStoreBreakdown();renderRankStats();renderMonthly(rr);renderHistory(rr);
}
function renderStoreBreakdown(){
 const scope=$("statsStore").value,ss=scope==="all"?stores:stores.filter(s=>s.id===scope);
 $("storeBreakdown").innerHTML=ss.map(s=>{const rr=records.filter(r=>r.storeId===s.id),net=sumOf(rr),gross=sumOf(rr,"gross");return `<div class="month"><span><b>${esc(s.shop)}</b><br><small>${rr.length}ゲーム</small></span><span style="text-align:right"><b class="${net>=0?'pos':'neg'}">込み ${fmt(net)}</b><br><small class="${gross>=0?'pos':'neg'}">抜き ${fmt(gross)}</small></span></div>`}).join("")||'<div class="empty">店舗がありません。</div>';
}
function setRankPeriod(p){rankPeriod=p;document.querySelectorAll(".pill").forEach(b=>b.classList.toggle("active",b.dataset.period===p));renderRankStats()}
function rankPeriodRecords(){
 const rr=filteredRecords(),y=today.slice(0,4),m=today.slice(0,7);
 return rr.filter(r=>rankPeriod==="day"?r.date===today:rankPeriod==="month"?r.date.slice(0,7)===m:r.date.slice(0,4)===y)
}
function renderRankStats(){
 const rr=rankPeriodRecords(),maxPlayers=rr.length?Math.max(...rr.map(r=>+r.players||storeForRecord(r)?.players||4)):($("statsStore").value!=="all"?(stores.find(s=>s.id===$("statsStore").value)?.players||4):4);
 const counts=Array.from({length:maxPlayers},(_,i)=>rr.filter(r=>+r.rank===i+1).length),max=Math.max(1,...counts),avg=rr.length?rr.reduce((a,r)=>a+(+r.rank||0),0)/rr.length:0;
 $("rankSummary").innerHTML=`<div class="rankgrid">${counts.map((n,i)=>`<div class="rankbox">${i+1}着<b>${n}回</b></div>`).join("")}</div><div class="note">平均着順：<b>${rr.length?avg.toFixed(2)+"着":"-"}</b> ／ ${rr.length}ゲーム</div>`;
 $("rankChart").innerHTML=counts.map((n,i)=>`<div class="barwrap"><div class="barvalue">${n}回</div><div class="bar" style="height:${Math.max(2,n/max*120)}px"></div><div class="barlabel">${i+1}着</div></div>`).join("");
}
function renderMonthly(rr){
 const mm={};rr.forEach(r=>mm[r.date.slice(0,7)]=(mm[r.date.slice(0,7)]||0)+(+r.total||0));const keys=Object.keys(mm).sort(),recent=keys.slice(-6),max=Math.max(1,...recent.map(k=>Math.abs(mm[k])));
 $("monthlyChart").innerHTML=recent.length?recent.map(k=>`<div class="barwrap"><div class="barvalue">${fmt(mm[k])}</div><div class="bar ${mm[k]<0?'negbar':''}" style="height:${Math.max(2,Math.abs(mm[k])/max*120)}px"></div><div class="barlabel">${k.slice(5)}月</div></div>`).join(""):'<div class="empty">まだ記録がありません。</div>';
 $("monthly").innerHTML=keys.reverse().map(k=>`<div class="month"><span>${k}</span><b class="${mm[k]>=0?'pos':'neg'}">${fmt(mm[k])}</b></div>`).join("")||'<div class="empty">まだ記録がありません。</div>';
}
let swipeStartX=0,swipeStartY=0;
function swipeStart(e,el){const t=e.touches&&e.touches[0];if(!t)return;document.querySelectorAll(".swipeRow.open").forEach(x=>{if(x!==el)x.classList.remove("open")});swipeStartX=t.clientX;swipeStartY=t.clientY}
function swipeEnd(e,el){const t=e.changedTouches&&e.changedTouches[0];if(!t)return;const dx=t.clientX-swipeStartX,dy=t.clientY-swipeStartY;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)){el.classList.toggle("open",dx<0)}}
function deleteHistoryRecord(i,e){if(e){e.stopPropagation();e.preventDefault()}const r=records[i];if(!r)return;if(!confirm(`${r.date}・${r.shop}・${r.rank}着の対局を削除しますか？`))return;records.splice(i,1);saveAll();renderStats();}
function showMoreHistory(){historyLimit+=10;renderStats()}
function renderHistory(rr){
 const allowed=new Set(rr.map(r=>r.id));
 const all=records.map((r,i)=>({r,i})).filter(o=>allowed.has(o.r.id)).reverse();
 const items=all.slice(0,historyLimit);
 const rows=items.map(({r,i})=>`<div class="swipeWrap"><button class="swipeDelete" type="button" onclick="deleteHistoryRecord(${i},event)">削除</button><div class="swipeRow" ontouchstart="swipeStart(event,this)" ontouchend="swipeEnd(event,this)" onclick="if(!this.classList.contains('open'))editRecord(${i})"><div class="month"><span>${r.date}・${gameNumber(r,i)}ゲーム目<br><small>${esc(r.shop)} / ${r.rank}着 / ${(+r.points||0).toLocaleString()}点 / チップ${r.chips||0}枚</small></span><b class="${(+r.total||0)>=0?'pos':'neg'}">${fmt(+r.total||0)}<small style="display:block;font-weight:400;color:#555">抜き ${fmt(recGross(r))}</small></b></div></div></div>`).join("");
 const more=all.length>historyLimit?`<button class="moreBtn" type="button" onclick="showMoreHistory()">さらに表示（残り${all.length-historyLimit}件）</button>`:"";
 $("history").innerHTML=(rows||'<div class="empty">まだ記録がありません。</div>')+more;
}


document.addEventListener("gesturestart",e=>e.preventDefault(),{passive:false});
let lastTouchEnd=0;document.addEventListener("touchend",e=>{const now=Date.now();if(now-lastTouchEnd<=300)e.preventDefault();lastTouchEnd=now},{passive:false});
renderStores();
</script>
</body></html>
